<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>ALSHENDY | الشندي</title>
<style>
:root{color-scheme:light;--ink:#17202a;--muted:#707783;--line:#e8ebef;--fb:#1877f2;--wa:#25d366;--tg:#229ed9;--ig:#e4405f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#e8f7ff 0,transparent 28%),radial-gradient(circle at 90% 85%,#fff0f5 0,transparent 30%),linear-gradient(180deg,#fff 0%,#f5f7fb 100%);color:var(--ink);font-family:Arial,Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;padding:30px 16px;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:180px;height:180px;border-radius:50%;filter:blur(45px);opacity:.3;pointer-events:none;z-index:-1;animation:floatGlow 8s ease-in-out infinite alternate}
body:before{background:#a8e5ff;top:5%;left:-70px}body:after{background:#ffc4df;bottom:5%;right:-70px;animation-delay:-4s}
@keyframes floatGlow{from{transform:translate3d(0,-12px,0) scale(.9)}to{transform:translate3d(18px,20px,0) scale(1.15)}}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes softPulse{0%,100%{box-shadow:0 8px 28px #17202a20,0 0 0 0 #dce7f500}50%{box-shadow:0 10px 32px #17202a24,0 0 0 8px #dce7f522}}
main{width:100%;max-width:430px;text-align:center}
.avatar{width:112px;height:112px;border-radius:50%;margin:0 auto 27px;border:3px solid #fff;display:grid;place-items:center;background:linear-gradient(145deg,#202833,#080b10);box-shadow:0 8px 28px #17202a20;color:#fff;font-size:17px;font-weight:800;letter-spacing:1.5px;direction:ltr;outline:2px solid #e4e8ee;animation:softPulse 3.5s ease-in-out infinite,riseIn .8s ease both}
h1{font-size:36px;letter-spacing:1px;margin:0;font-weight:800;color:#101820;animation:riseIn .7s .12s ease both}
.subtitle{animation:riseIn .7s .22s ease both}
.subtitle{color:var(--muted);font-size:16px;margin:14px 0 30px}
.links{display:grid;gap:14px}
a.social{display:flex;align-items:center;gap:16px;text-align:right;text-decoration:none;color:var(--ink);padding:16px 17px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 5px 16px #1c2b3a0a;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;min-height:92px;position:relative;overflow:hidden;animation:riseIn .65s ease both}
a.social:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,#ffffffb8 45%,transparent 65%);background-size:200% 100%;transform:translateX(100%);transition:transform .6s ease;pointer-events:none}
a.social:hover:before{transform:translateX(-100%)}
a.social:hover{transform:translateY(-5px) scale(1.015);box-shadow:0 14px 28px #1c2b3a18;border-color:#d9e2ed}
a.social:active{transform:scale(.98)}
a.social:nth-child(1){animation-delay:.18s}a.social:nth-child(2){animation-delay:.3s}a.social:nth-child(3){animation-delay:.42s}
.symbol{flex:0 0 62px;width:62px;height:62px;display:grid;place-items:center;border-radius:19px;color:#fff}
.symbol svg{width:30px;height:30px;fill:currentColor;transition:transform .3s ease}
a.social:hover .symbol svg{transform:rotate(-8deg) scale(1.12)}
.whatsapp .symbol{box-shadow:0 0 0 0 #25d36650;animation:waPulse 2.8s infinite}
@keyframes waPulse{0%,100%{box-shadow:0 0 0 0 #25d36600}50%{box-shadow:0 0 0 6px #25d36622}}
.facebook .symbol{background:var(--fb)}.whatsapp .symbol{background:var(--wa)}.telegram .symbol{background:var(--tg)}.instagram .symbol{background:linear-gradient(135deg,#833ab4 0%,#e1306c 52%,#f77737 100%)}
.copy{min-width:0}.label{font-size:19px;font-weight:700}.desc{font-size:14px;color:var(--muted);margin-top:7px}.arrow{margin-right:auto;color:#9aa3ad;font-size:23px;direction:ltr}
footer{margin-top:30px;color:#7b8490;font-size:14px;line-height:2;animation:riseIn .8s .5s ease both}.legal{margin-top:17px;color:#858d97;font-size:12px;line-height:1.9;animation:riseIn .8s .6s ease both}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:360px){a.social{padding:13px;gap:12px}.symbol{flex-basis:54px;width:54px;height:54px}.label{font-size:17px}.desc{font-size:13px}}

/* Signature motion layer */
body{isolation:isolate;position:relative;background:linear-gradient(135deg,#fff 0%,#f8fbff 45%,#fff7fb 100%);}
.ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.ambient i{position:absolute;display:block;width:7px;height:7px;border-radius:50%;background:#9edfff;opacity:.55;box-shadow:0 0 18px #6ccfff;animation:particleDrift 12s ease-in-out infinite}
.ambient i:nth-child(1){left:8%;top:18%;animation-delay:-2s}.ambient i:nth-child(2){left:86%;top:13%;background:#ff9bc8;animation-delay:-7s}.ambient i:nth-child(3){left:18%;top:70%;width:5px;height:5px;animation-delay:-4s}.ambient i:nth-child(4){left:90%;top:76%;background:#ffc56b;animation-delay:-9s}.ambient i:nth-child(5){left:50%;top:9%;background:#c4a7ff;animation-delay:-5s}.ambient i:nth-child(6){left:70%;top:48%;animation-delay:-1s}.ambient i:nth-child(7){left:5%;top:48%;background:#ffc56b;animation-delay:-8s}.ambient i:nth-child(8){left:38%;top:88%;background:#ff9bc8;animation-delay:-3s}.ambient i:nth-child(9){left:75%;top:91%;animation-delay:-6s}.ambient i:nth-child(10){left:30%;top:25%;background:#c4a7ff;animation-delay:-10s}.ambient i:nth-child(11){left:60%;top:68%;background:#ff9bc8;animation-delay:-4s}.ambient i:nth-child(12){left:96%;top:35%;animation-delay:-11s}
@keyframes particleDrift{0%,100%{transform:translate(0,0) scale(.7);opacity:.2}50%{transform:translate(18px,-30px) scale(1.5);opacity:.8}}
.topline{position:fixed;top:0;left:0;width:100%;height:3px;z-index:5;background:#edf1f7;overflow:hidden}.topline span{display:block;width:35%;height:100%;background:linear-gradient(90deg,#1877f2,#229ed9,#e4405f);animation:topTravel 5s ease-in-out infinite alternate}
@keyframes topTravel{from{transform:translateX(-10%)}to{transform:translateX(210%)}}
.hero-mark{position:relative;width:148px;height:148px;margin:0 auto 20px;display:grid;place-items:center;animation:riseIn .8s ease both}
.avatar{position:relative;z-index:2;width:108px;height:108px;margin:0;border:3px solid #fff;background:linear-gradient(135deg,#111827,#344054 55%,#111827);box-shadow:0 12px 32px #11182725;color:#fff;animation:logoFloat 4s ease-in-out infinite,softPulse 3.5s ease-in-out infinite}
.avatar span{background:linear-gradient(90deg,#fff,#b8eaff,#fff,#ffd2e4);background-size:250% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:metalShine 4s linear infinite}
.avatar b{position:absolute;top:3px;right:1px;color:#ffe28a;font-size:17px;animation:starSpin 7s linear infinite}
.orbit{position:absolute;border-radius:50%;border:1px solid #a7ddf866;inset:5px;animation:orbitSpin 12s linear infinite}.orbit:before{content:"✦";position:absolute;top:7px;left:18px;color:#229ed9;font-size:15px;text-shadow:0 0 12px #229ed9}.orbit-two{inset:0;border-color:#f5b8d866;border-style:dashed;animation:orbitSpin 20s linear infinite reverse}.orbit-two:before{content:"✧";top:auto;left:auto;bottom:10px;right:13px;color:#e4405f}
@keyframes orbitSpin{to{transform:rotate(360deg)}}@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes metalShine{to{background-position:250% center}}@keyframes starSpin{to{transform:rotate(360deg)}}
h1{background:linear-gradient(100deg,#111827 5%,#1877f2 42%,#a855f7 68%,#111827 95%);background-size:220% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:riseIn .7s .12s ease both,titleShimmer 7s linear infinite}
@keyframes titleShimmer{to{background-position:220% center}}
.status-line{display:flex;justify-content:center;align-items:center;gap:8px;margin:-16px 0 25px;color:#737d8b;font-size:12px;animation:riseIn .8s .3s ease both}.status-dot{width:7px;height:7px;background:#25d366;border-radius:50%;box-shadow:0 0 0 4px #25d36620;animation:dotBeat 1.8s infinite}.sparkle{color:#e6a93d;animation:starSpin 8s linear infinite}@keyframes dotBeat{50%{box-shadow:0 0 0 8px #25d36600}}
a.social{border-color:#e8edf4;background:linear-gradient(120deg,#fff,#fcfdff);box-shadow:0 10px 28px #27364b0c;transform-style:preserve-3d}
a.social:after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid transparent;background:linear-gradient(120deg,#1877f222,#229ed922,#e4405f22) border-box;mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);mask-composite:exclude;opacity:0;transition:opacity .3s;pointer-events:none}a.social:hover:after{opacity:1}
a.social:hover{transform:translateY(-7px) scale(1.02);box-shadow:0 18px 38px #27364b18}
.symbol{position:relative;overflow:hidden;box-shadow:0 7px 16px #17202a12}.symbol:after{content:"";position:absolute;inset:-60% auto -60% -70%;width:45%;transform:rotate(25deg);background:#ffffff55;animation:iconSweep 5s ease-in-out infinite}
@keyframes iconSweep{0%,65%{left:-70%}85%,100%{left:140%}}
.instagram .symbol{background:linear-gradient(135deg,#833ab4 0%,#e1306c 52%,#f77737 100%);background-size:180% 180%;animation:instagramFlow 6s ease infinite}
@keyframes instagramFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.signature{display:flex;align-items:center;justify-content:center;gap:10px;margin:25px 0 0;color:#a0a7b2;font-size:9px;letter-spacing:3px;direction:ltr}.signature-line{height:1px;width:50px;background:linear-gradient(90deg,transparent,#cbd5e1,transparent);animation:linePulse 2.8s ease-in-out infinite}@keyframes linePulse{50%{width:76px;opacity:.45}}
footer{color:#697586}.legal{color:#9098a4}
@media(prefers-reduced-motion:reduce){.ambient i,.topline span,.orbit,.orbit-two,.avatar,.avatar span,.avatar b,h1,.status-dot,.sparkle,.symbol:after,.instagram .symbol,.signature-line{animation:none!important}}

</style>
</head>
